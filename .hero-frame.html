<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #081126;
      overflow: hidden;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
      filter: saturate(0.9) contrast(1.05) brightness(0.92);
    }
  </style>
</head>
<body>
  <video autoplay muted playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>
</body>
</html>
