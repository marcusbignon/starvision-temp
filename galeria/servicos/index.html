<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarVision Security | Galeria de Serviços</title>
  <meta name="description" content="Galeria em mosaico com fotos de serviços, projetos e obras de segurança eletrônica, automação, redes e infraestrutura.">
  <style>
    :root{color-scheme:dark;--bg:#081126;--panel:rgba(13,29,62,.84);--line:rgba(220,230,248,.16);--text:#f4f7ff;--muted:#a7b4d9;--accent:#f52a46;--signal:#4fa3ff;--silver:#dce6f8;--max:1200px}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at top left,rgba(79,163,255,.18),transparent 28%),linear-gradient(180deg,#07101f,#0a1731 45%,#081126);overflow-x:hidden}body.lightbox-open{overflow:hidden}a{color:inherit;text-decoration:none}button{font:inherit}.wrap{width:min(calc(100% - 32px),var(--max));margin:0 auto}.site-header{position:sticky;top:0;z-index:10;background:rgba(7,16,31,.78);backdrop-filter:blur(16px);border-bottom:1px solid rgba(220,230,248,.08)}.header-inner{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:54px}.brand strong{display:block;letter-spacing:.14em;text-transform:uppercase}.brand span{display:block;color:var(--muted);font-size:.76rem;letter-spacing:.3em;text-transform:uppercase}.nav{display:flex;gap:18px;flex-wrap:wrap;color:#dce6f8;font-weight:700}.contact-link{padding:10px 14px;border:1px solid rgba(245,42,70,.24);border-radius:999px;background:rgba(245,42,70,.13)}.hero{padding:58px 0 28px}.eyebrow{display:inline-flex;gap:10px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:999px;color:#dce6f8;font-size:.8rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px rgba(245,42,70,.8)}h1{max-width:820px;margin:22px 0 16px;font-size:clamp(2rem,5vw,4rem);line-height:.96}p{color:var(--muted);line-height:1.7}.hero p{max-width:760px;font-size:1.08rem}.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.05);font-weight:800}.gallery-actions{display:flex;flex-direction:column;align-items:flex-end;gap:12px;margin-top:22px}.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--silver);font-weight:900;letter-spacing:.08em;text-transform:uppercase}.back-link::after{content:"→";color:var(--accent);font-size:1.1rem;line-height:1}.back-link:hover,.back-link:focus-visible{color:var(--text)}.category-filter{display:grid;gap:8px;color:var(--silver);font-weight:800;width:min(100%,460px)}.category-filter span{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}.category-filter select{min-height:48px;min-width:min(100%,360px);width:100%;padding:0 42px 0 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.05);color:var(--text);font:inherit;font-weight:700}.category-filter option{background:#081126;color:#f4f7ff}.gallery{padding:24px 0 82px}.mosaic{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-flow:dense;gap:10px}.tile{position:relative;min-height:170px;padding:0;border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden;cursor:pointer;box-shadow:0 18px 36px rgba(2,8,22,.24)}.tile:nth-child(9n+1){grid-column:span 2;grid-row:span 2}.tile:nth-child(7n+3){grid-column:span 2}.tile:nth-child(11n+5){grid-row:span 2}.tile img{width:100%;height:100%;min-height:170px;object-fit:cover;display:block;filter:saturate(1.05) contrast(1.02);transition:transform .22s ease,filter .22s ease}.tile:hover img,.tile:focus-visible img{transform:scale(1.04);filter:saturate(1.16) brightness(1.05)}.tile:focus-visible{outline:2px solid var(--signal);outline-offset:3px}.lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:72px 22px 28px;background:rgba(2,8,22,.88);backdrop-filter:blur(12px)}.lightbox.is-open{display:flex}.lightbox img{max-width:min(1120px,100%);max-height:calc(100vh - 128px);border-radius:22px;border:1px solid rgba(220,230,248,.2);box-shadow:0 28px 70px rgba(0,0,0,.58);object-fit:contain}.lightbox-bar{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(8,17,38,.8);color:var(--silver);font-weight:800}.lightbox button{position:absolute;display:inline-grid;place-items:center;border:1px solid rgba(220,230,248,.2);background:rgba(13,29,62,.78);color:#fff;cursor:pointer}.lightbox-close{top:18px;right:18px;width:44px;height:44px;border-radius:50%;font-size:1.25rem}.lightbox-prev,.lightbox-next{top:50%;width:52px;height:64px;border-radius:18px;font-size:2rem;transform:translateY(-50%)}.lightbox-prev{left:18px}.lightbox-next{right:18px}@media(max-width:900px){.mosaic{grid-template-columns:repeat(3,minmax(0,1fr))}.tile:nth-child(n){grid-column:span 1;grid-row:span 1}.tile:nth-child(6n+1){grid-column:span 2}.lightbox-prev,.lightbox-next{top:auto;bottom:18px;transform:none}.lightbox-prev{left:calc(50% - 66px)}.lightbox-next{right:calc(50% - 66px)}}@media(max-width:620px){.header-inner{align-items:flex-start;flex-direction:column;padding:14px 0}.gallery-actions{align-items:stretch}.back-link{align-self:flex-end}.category-filter{min-width:0;width:100%}.category-filter select{width:100%}.nav{gap:12px}.mosaic{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{min-height:132px;border-radius:14px}.tile:nth-child(6n+1){grid-column:span 1}.hero{padding-top:40px}.lightbox{padding-inline:12px}.lightbox-close{right:12px}}
  </style>
</head>
<body>
  <header class="site-header"><div class="wrap header-inner"><a class="brand" href="../../#inicio" aria-label="StarVision Security"><img src="../../logo-transparent.png" alt="Logo StarVision Security"><div><strong>StarVision</strong><span>Security</span></div></a></div></header>
  <main>
    <section class="hero"><div class="wrap"><h1>Galeria de fotos</h1><p>Conheça um pouco sobre o padrão de execução dos nossos projetos.</p><div class="gallery-actions"><label class="category-filter" for="gallery-category"><span>Categoria</span><select id="gallery-category" aria-label="Filtrar fotos por categoria"></select></label><a class="back-link" href="../../servicos/seguranca-eletronica/">Voltar</a></div></div></section>
    <section class="gallery" aria-label="Galeria em mosaico"><div class="wrap mosaic" id="gallery-grid"></div></section>
  </main>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visualizador de fotos">
    <div class="lightbox-bar"><span id="lightbox-counter">1 / 1</span></div>
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Fechar">×</button>
    <button class="lightbox-prev" id="lightbox-prev" type="button" aria-label="Foto anterior">‹</button>
    <img id="lightbox-image" src="" alt="">
    <button class="lightbox-next" id="lightbox-next" type="button" aria-label="Próxima foto">›</button>
  </div>
  <script>
    const galleryImages = [
      {src:'https://images.unsplash.com/photo-1557597774-9d273605dfa9?auto=format&fit=crop&w=1200&q=82',alt:'Instalação de câmera de CFTV em fachada comercial',category:'segurança eletrônica'},
      {src:'https://images.unsplash.com/photo-1558002038-1055907df827?auto=format&fit=crop&w=1000&q=82',alt:'Câmera de vigilância externa instalada em parede',category:'segurança eletrônica'},
      {src:'https://images.unsplash.com/photo-1544724569-5f546fd6f2b5?auto=format&fit=crop&w=1000&q=82',alt:'Detalhe de câmera IP para monitoramento eletrônico',category:'segurança eletrônica'},
      {src:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=1000&q=82',alt:'Câmera dome instalada em teto interno',category:'segurança eletrônica'},
      {src:'https://images.unsplash.com/photo-1563770660941-10a63607739b?auto=format&fit=crop&w=1000&q=82',alt:'Fechadura eletrônica aplicada em porta de acesso',category:'controle de acesso e portaria'},
      {src:'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1000&q=82',alt:'Operador acompanhando controle de acesso em notebook',category:'controle de acesso e portaria'},
      {src:'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1000&q=82',alt:'Entrada corporativa preparada para portaria monitorada',category:'controle de acesso e portaria'},
      {src:'https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1000&q=82',alt:'Recepção corporativa com fluxo de acesso organizado',category:'controle de acesso e portaria'},
      {src:'https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1000&q=82',alt:'Escritório com automação corporativa integrada',category:'automação residencial e corporativa'},
      {src:'https://images.unsplash.com/photo-1494526585095-c41746248156?auto=format&fit=crop&w=1000&q=82',alt:'Residência preparada para automação e segurança integrada',category:'automação residencial e corporativa'},
      {src:'https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=1200&q=82',alt:'Ambiente moderno com tecnologia de automação integrada',category:'automação residencial e corporativa'},
      {src:'https://images.unsplash.com/photo-1531297484001-80022131f5a1?auto=format&fit=crop&w=1000&q=82',alt:'Dispositivos conectados para automação de ambientes',category:'automação residencial e corporativa'},
      {src:'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1000&q=82',alt:'Quarto com iluminação e climatização de conforto',category:'iluminação climatização e conforto'},
      {src:'https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1000&q=82',alt:'Sala residencial com cenas de iluminação planejada',category:'iluminação climatização e conforto'},
      {src:'https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=1000&q=82',alt:'Ambiente corporativo com iluminação linear e conforto térmico',category:'iluminação climatização e conforto'},
      {src:'https://images.unsplash.com/photo-1484101403633-562f891dc89a?auto=format&fit=crop&w=1000&q=82',alt:'Área interna climatizada com iluminação de apoio',category:'iluminação climatização e conforto'},
      {src:'https://images.unsplash.com/photo-1581092918056-0c4c3acd3789?auto=format&fit=crop&w=1000&q=82',alt:'Rack técnico com cabeamento estruturado organizado',category:'infraestrutura redes e conectividade'},
      {src:'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=1000&q=82',alt:'Servidores e switches em infraestrutura de rede',category:'infraestrutura redes e conectividade'},
      {src:'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1000&q=82',alt:'Componentes eletrônicos usados em conectividade',category:'infraestrutura redes e conectividade'},
      {src:'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=1000&q=82',alt:'Técnico revisando infraestrutura de conectividade',category:'infraestrutura redes e conectividade'},
      {src:'https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1000&q=82',alt:'Equipe configurando comunicação corporativa em estações de trabalho',category:'telefonia e comunicação corporativa'},
      {src:'https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?auto=format&fit=crop&w=1000&q=82',alt:'Reunião técnica para implantação de telefonia corporativa',category:'telefonia e comunicação corporativa'},
      {src:'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1000&q=82',alt:'Central de operação para comunicação e atendimento corporativo',category:'telefonia e comunicação corporativa'},
      {src:'https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1000&q=82',alt:'Equipe alinhando escopo de comunicação corporativa',category:'telefonia e comunicação corporativa'}
    ];
    const categories = ['todas as fotos','segurança eletrônica','controle de acesso e portaria','automação residencial e corporativa','iluminação climatização e conforto','infraestrutura redes e conectividade','telefonia e comunicação corporativa'];
    const grid=document.getElementById('gallery-grid'), lightbox=document.getElementById('lightbox'), lightboxImage=document.getElementById('lightbox-image'), counter=document.getElementById('lightbox-counter'), categorySelect=document.getElementById('gallery-category');let currentIndex=0;let visibleImages=[];
    const categorizedImages=galleryImages;
    const capitalizeFirstWord=(text)=>text.replace(/^([\p{L}])/u,(letter)=>letter.toLocaleUpperCase('pt-BR'));
    categorySelect.replaceChildren(...categories.map((category)=>{const option=document.createElement('option');option.value=category;option.textContent=capitalizeFirstWord(category);return option}));
    const showImage=(index)=>{if(!visibleImages.length)return;currentIndex=(index+visibleImages.length)%visibleImages.length;const {src,alt}=visibleImages[currentIndex];lightboxImage.src=src.replace('w=1000','w=1600').replace('w=1200','w=1800');lightboxImage.alt=alt;counter.textContent=`${currentIndex+1} / ${visibleImages.length}`};
    const openLightbox=(index)=>{showImage(index);lightbox.classList.add('is-open');document.body.classList.add('lightbox-open')};
    const closeLightbox=()=>{lightbox.classList.remove('is-open');document.body.classList.remove('lightbox-open');lightboxImage.src=''};
    const renderGallery=()=>{const selected=categorySelect.value;visibleImages=selected==='todas as fotos'?categorizedImages:categorizedImages.filter((image)=>image.category===selected);grid.replaceChildren(...visibleImages.map(({src,alt},index)=>{const button=document.createElement('button');button.className='tile';button.type='button';button.innerHTML=`<img src="${src}" alt="${alt}" loading="lazy" onerror="this.closest('.tile').remove()">`;button.addEventListener('click',()=>openLightbox(index));return button}));counter.textContent=`1 / ${Math.max(visibleImages.length,1)}`};
    categorySelect.addEventListener('change',renderGallery);renderGallery();
    document.getElementById('lightbox-close').addEventListener('click',closeLightbox);document.getElementById('lightbox-prev').addEventListener('click',()=>showImage(currentIndex-1));document.getElementById('lightbox-next').addEventListener('click',()=>showImage(currentIndex+1));lightbox.addEventListener('click',(event)=>{if(event.target===lightbox)closeLightbox()});window.addEventListener('keydown',(event)=>{if(!lightbox.classList.contains('is-open'))return;if(event.key==='Escape')closeLightbox();if(event.key==='ArrowLeft')showImage(currentIndex-1);if(event.key==='ArrowRight')showImage(currentIndex+1)});
  </script>
</body>
</html>
